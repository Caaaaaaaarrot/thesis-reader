[project]
name = "thesis-reader"
version = "0.1.0"
description = "智能论文管理与阅读助手"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.0",
    "pymupdf>=1.24.0",
    "watchdog>=4.0.0",
]

[project.scripts]
thesis-reader = "backend.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
